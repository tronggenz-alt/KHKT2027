<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cơ chế SN2 – SN1</title>
<style>
:root{
  --kinh:rgba(18,24,44,.78); --vien:rgba(255,255,255,.12); --chu:#e8ecf5; --chu-phu:#9aa5bd;
  --do:#ff6b6b; --lam:#6ab7ff; --nhan:rgb(230,236,245); --muc:#1b2621;
}
body.giay{ --kinh:rgba(255,253,247,.92); --vien:rgba(27,38,33,.14); --chu:#1b2621; --chu-phu:#5d6862; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--chu)}
#canvas{position:fixed;inset:0}
#nhan-lop{position:fixed;inset:0;pointer-events:none}
.nhan{font-weight:600;color:var(--nhan);white-space:nowrap;text-shadow:0 0 6px rgba(0,0,0,.6)}
.dt{width:19px;height:19px;border-radius:50%;border:1.6px solid currentColor;display:grid;place-items:center;font:700 14px/1 system-ui}
.the{padding:5px 10px;border-radius:999px;font:600 12.5px/1.3 system-ui;max-width:240px;white-space:normal;text-align:center;border:1.5px solid currentColor;backdrop-filter:blur(4px)}
.the.do{color:var(--do);background:rgba(255,107,107,.14)}
.the.lam{color:var(--lam);background:rgba(106,183,255,.14)}

header{position:fixed;top:14px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;z-index:5}
header>*{pointer-events:auto}
h1{margin:0;font-size:19px;transition:color .9s}
header p{margin:3px 0 0;color:var(--chu-phu);font-size:13px}
#chuyen{position:relative;display:flex;border:1px solid var(--vien);background:var(--kinh);border-radius:999px;padding:4px;cursor:pointer;backdrop-filter:blur(10px);transition:background .9s,border-color .9s}
#chuyen span{position:relative;z-index:1;padding:7px 16px;font:600 14px system-ui;color:var(--chu-phu);transition:color .5s}
#chuyen i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:#3b82f6;transition:transform .55s cubic-bezier(.65,0,.35,1),background .9s}
body.giay #chuyen i{transform:translateX(100%);background:#1b2621}
#chuyen span.bat{color:#fff}
body.giay #chuyen span.bat{color:#f6f1e6}
header>div{transition:opacity .5s}
body.giay header>div{opacity:0;pointer-events:none}
#goi-y{position:fixed;top:66px;left:16px;font-size:12px;color:var(--chu-phu);transition:opacity .6s}
body.giay #goi-y{opacity:0}

#bang{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(780px,calc(100% - 32px));background:var(--kinh);border:1px solid var(--vien);border-radius:16px;padding:14px 16px 12px;backdrop-filter:blur(12px);transition:opacity .6s,transform .6s;z-index:4}
body.giay #bang{opacity:0;pointer-events:none;transform:translate(-50%,24px)}
.dong1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#chip{font:700 11.5px system-ui;padding:4px 9px;border-radius:999px;letter-spacing:.3px;color:#fff}
#chip.khong{background:#d32f2f} #chip.co{background:#2e7d32} #chip.trung{display:none}
h2{margin:0;font-size:16px}
#mo-ta{margin:8px 0 10px;font-size:14px;line-height:1.5;min-height:42px}
#truc{position:relative;display:flex;gap:3px;height:22px;margin-bottom:10px}
#truc .doan{position:relative;height:6px;margin-top:8px;border-radius:3px;background:rgba(232,236,245,.16);overflow:hidden}
#truc .doan b{position:absolute;inset:0;width:0;background:#3b82f6}
#truc .doan.khong b{background:#ef4444}
#keo{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer;margin:0}
.nut{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nut button,.nut select{font:600 14px system-ui;color:var(--chu);background:transparent;border:1px solid var(--vien);border-radius:9px;padding:6px 12px;cursor:pointer}
.nut button:hover{background:rgba(255,255,255,.08)}
.nut select option{color:#111}
.chu-thich{margin-left:auto;font-size:12px;color:var(--chu-phu);display:flex;gap:12px;flex-wrap:wrap}
.chu-thich i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffd166;box-shadow:0 0 6px #ffd166;margin-right:5px;vertical-align:1px}

/* ---------- tờ bài giải (chế độ giấy, tĩnh) ---------- */
#to-giay{position:fixed;inset:0;overflow:auto;opacity:0;visibility:hidden;padding:76px 16px 48px;z-index:3}
.to{max-width:880px;margin:0 auto;background:#fffdf7;border:1px solid #e3dccb;box-shadow:0 12px 34px rgba(60,50,20,.10);border-radius:6px;padding:26px 34px 30px;color:var(--muc);font-family:"Times New Roman",Georgia,serif;transform:translateY(calc((1 - var(--hien,1)) * 18px))}
.to h2{font-size:24px;margin:0 0 10px;text-align:center;letter-spacing:.5px}
.to .de{font-size:17px;line-height:1.55;margin:0 0 6px}
.buoc{margin:14px -16px 0;padding:8px 16px 10px;border-left:3px solid transparent;border-radius:2px}
.buoc.dang-xem{border-left-color:#c62828;background:rgba(198,40,40,.045)}
.buoc h3{font-size:18px;margin:0 0 6px}
.buoc p,.buoc li{font-size:16.5px;line-height:1.55;margin:6px 0}
.buoc ul{margin:4px 0;padding-left:22px}
.hinh{display:block;margin:4px auto;max-width:100%;height:auto;overflow:visible}
.hinh text.nt{font:600 17px "Helvetica Neue",Arial,sans-serif;text-anchor:middle;dominant-baseline:central;fill:var(--muc)}
.hinh .lk{stroke:var(--muc);stroke-width:1.8;stroke-linecap:round}
.hinh .e{fill:var(--muc)}
.hinh .dt{fill:#fffdf7;stroke:var(--muc);stroke-width:1.3}
.hinh .dtc{font:700 13px Arial,sans-serif;text-anchor:middle;dominant-baseline:central;fill:var(--muc)}
.hinh .mt{fill:none;stroke:#c62828;stroke-width:1.8;stroke-linecap:round}
.hinh .mt.gach{stroke:#8f9592;stroke-dasharray:6 5}
.hinh .x{fill:#c62828;font:700 26px Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.hinh .pu{stroke:var(--muc);stroke-width:1.6}
.hinh .dk{font:italic 15px "Times New Roman",serif;text-anchor:middle;fill:var(--muc)}
.pt{font-size:17px;text-align:center;margin:8px 0}
.tieu-de{font-style:italic;text-decoration:underline wavy #c9a227;text-underline-offset:4px}
#nut-gt{margin-top:14px;font:600 14.5px system-ui;color:#1b2621;background:#f3ecdc;border:1px solid #dccfae;border-radius:10px;padding:8px 14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
#nut-gt:hover{background:#ece2c9}
#nut-gt b{display:inline-block;transition:transform .3s}
#nut-gt[aria-expanded="true"] b{transform:rotate(180deg)}
#gt{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s ease}
#gt.mo{grid-template-rows:1fr}
#gt>div{overflow:hidden}
#gt .noi{margin-top:12px;padding:12px 18px;border-left:3px solid #c9a227;background:#fbf6e9;border-radius:4px;font-size:16.5px;line-height:1.55}
#gt .noi p{margin:6px 0}
@media (max-width:560px){ h1{font-size:16px} #mo-ta{font-size:13px} .chu-thich{display:none} #chuyen span{padding:6px 12px} .to{padding:18px 16px} .buoc{margin:12px -8px 0;padding:8px} }
</style>
</head>
<body>
<div id="canvas"></div>
<div id="nhan-lop"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="dau" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="dau-den" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b2621"/></marker>
  </defs>
</svg>

<div id="to-giay"><article class="to" id="to"></article></div>

<header>
  <div><h1>SN2 hay SN1?</h1><p>(CH₃)₃C–Br + OH⁻ · bản thử cơ chế 3D ⇄ giấy</p></div>
  <button id="chuyen" title="Phím G"><span class="c3 bat">3D</span><span class="cg">Giấy</span><i></i></button>
</header>
<div id="goi-y">Kéo để xoay 360° · cuộn để phóng to</div>

<section id="bang">
  <div class="dong1"><span id="chip"></span><h2 id="ten-gd"></h2></div>
  <p id="mo-ta"></p>
  <div id="truc"><input id="keo" type="range" min="0" max="1000" value="0" aria-label="Tua"></div>
  <div class="nut">
    <button id="lui" title="Bước trước (←)">⏮</button>
    <button id="chay" title="Chạy / dừng (Space)">⏸</button>
    <button id="toi" title="Bước sau (→)">⏭</button>
    <select id="toc"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option></select>
    <button id="nut-h" aria-pressed="false" title="Ẩn / hiện nguyên tử H (phím H)">Ẩn H</button>
    <div class="chu-thich"><span><i></i>cặp electron</span><span>xám đậm C · trắng H · đỏ O · nâu Br</span></div>
  </div>
</section>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

// ================================================================ tiện ích
const V = (x, y, z = 0) => new THREE.Vector3(x, y, z);
const kep = x => Math.min(1, Math.max(0, x));
const sm = x => { x = kep(x); return x * x * (3 - 2 * x); };
const seg = (t, a, b) => sm((t - a) / (b - a));
const bump = (t, a, b, c, d) => seg(t, a, b) * (1 - seg(t, c, d));
const giua = (a, b) => a.clone().add(b).multiplyScalar(.5);
const huong = (a, b) => b.clone().sub(a).normalize();
function vuongGoc(u) {
  const v = V(0, 1, 0).addScaledVector(u, -u.y);
  if (v.lengthSq() < 1e-4) v.set(0, 0, 1).addScaledVector(u, -u.z);
  return v.normalize();
}
// hướng tứ diện thứ "goc" của nguyên tử có một liên kết theo hướng u (109,5° so với u)
function tuDien(u, goc) {
  const v = vuongGoc(u), w = new THREE.Vector3().crossVectors(u, v);
  return u.clone().multiplyScalar(-.333).addScaledVector(v, .943 * Math.cos(goc)).addScaledVector(w, .943 * Math.sin(goc)).normalize();
}
const MAU_NEN = new THREE.Color("#0b1020"), MAU_GIAY = new THREE.Color("#f6f1e6"), MUC = new THREE.Color("#1b2621");
const VANG = new THREE.Color("#ffd166"), DO = new THREE.Color("#ff4d4d"), DEN = new THREE.Color(0);

// ================================================================ tư thế 3D (Å) và hình phẳng (dùng khi chuyển sang giấy)
const P3 = {}, Q = {};
P3["0"] = { C: V(0, 0, 0), Br: V(1.95, 0, 0), M1: V(-.513, 1.452, 0), M2: V(-.513, -.726, 1.257), M3: V(-.513, -.726, -1.257), O: V(-6.4, .4, 0) };
P3.B = { ...P3["0"], O: V(-3.35, 0, 0) };
P3["1"] = { C: V(0, 0, 0), Br: V(5.4, -1.2, 0), M1: V(0, 1.5, 0), M2: V(0, -.75, 1.3), M3: V(0, -.75, -1.3), O: V(-6.4, .4, 0) };
P3.A = { ...P3["1"], O: V(-2.7, 0, 0) };
P3["2"] = { C: V(0, 0, 0), Br: V(5.4, -1.2, 0), M1: V(.513, 1.452, 0), M2: V(.513, -.726, 1.257), M3: V(.513, -.726, -1.257), O: V(-1.43, 0, 0) };

Q["0"] = { C: V(0, 0), M1: V(0, 1.5), M2: V(0, -1.5), M3: V(-1.5, 0), Br: V(1.6, 0), O: V(-5, 0) };
Q.B = { ...Q["0"], O: V(-3.5, 0) };
Q["1"] = { C: V(0, 0), M1: V(0, 1.5), M2: V(1.3, -.75), M3: V(-1.3, -.75), Br: V(3.8, 0), O: V(-5, 0) };
Q.A = { ...Q["1"], O: V(-3.0, 0) };
Q["2"] = { C: V(0, 0), M1: V(0, 1.5), M2: V(1.5, 0), M3: V(0, -1.5), O: V(-1.5, 0), Br: V(4.2, 0) };

// ================================================================ giai đoạn
const M_CUA = (a, b) => ({ M1: [a, b], M2: [a, b], M3: [a, b] });
const GD = [
  { ten: "Chất ban đầu", dur: 3, tu: "0", den: "0", kha: null,
    mo_ta: "tert-Butyl bromide (CH₃)₃C–Br và ion OH⁻. O mang 3 cặp electron tự do; liên kết C–Br phân cực (C δ+, Br δ−). Xoay để thấy 9 nguyên tử H của ba nhóm CH₃." },
  { ten: "Thử SN2: OH⁻ tấn công mặt sau", dur: 5.5, tu: "0", qua: "B", qua_t: [.42, .6], den: "0", kha: false,
    mo_ta: "SN2 đòi hỏi nucleophile vào từ phía sau, ngược hướng với Br (180°). Ở carbon bậc ba, ba nhóm CH₃ (9 nguyên tử H) che kín mặt sau nên cặp e của O không tới được C. Đường SN2 bị chặn → chuyển sang SN1." },
  { ten: "SN1 bước 1 (chậm): C–Br đứt dị li", dur: 5, tu: "0", den: "1", kha: true, cua: { Br: [.3, 1], ...M_CUA(.35, 1) },
    mo_ta: "Cặp electron của liên kết C–Br dồn hẳn về Br. Br⁻ tách ra, để lại carbocation bậc ba. Đây là bước chậm quyết định tốc độ: v = k[(CH₃)₃CBr]." },
  { ten: "Carbocation phẳng, orbital p trống", dur: 4, tu: "1", den: "1", kha: true,
    mo_ta: "C⁺ lai hoá sp²: ba nhóm CH₃ nằm trên một mặt phẳng (120°), orbital p trống vuông góc với mặt phẳng đó. Ba nhóm CH₃ đẩy electron nên carbocation bậc ba bền. Nucleophile vào được từ cả hai mặt." },
  { ten: "SN1 bước 2 (nhanh): OH⁻ tấn công C⁺", dur: 5, tu: "1", qua: "A", qua_t: [.35, .4], den: "2", kha: true, cua: M_CUA(.45, 1),
    mo_ta: "Một cặp electron tự do của O dồn vào orbital p trống, tạo liên kết C–O. Carbon trở lại dạng tứ diện sp³; điện tích − của O và + của C cùng mất." },
  { ten: "Sản phẩm", dur: 3, tu: "2", den: "2", kha: null,
    mo_ta: "(CH₃)₃C–OH (2-methylpropan-2-ol) + Br⁻. Dẫn xuất bậc ba thế theo SN1, không theo SN2. Lưu ý: với OH⁻ đặc và đun nóng, phản ứng tách (tạo alkene) cạnh tranh mạnh." },
];
const TONG = GD.reduce((s, g) => s + g.dur, 0);
const BAT_DAU = []; GD.reduce((s, g) => (BAT_DAU.push(s), s + g.dur), 0);
function giaiDoan(T) {
  for (let i = 0; i < GD.length; i++) if (T < BAT_DAU[i] + GD[i].dur) return [i, (T - BAT_DAU[i]) / GD[i].dur];
  return [GD.length - 1, 1];
}
function viTri(P, k, g, t) {
  const r = g.cua?.[k]; if (r) t = kep((t - r[0]) / (r[1] - r[0]));
  const a = P[g.tu][k], c = P[g.den][k];
  if (g.qua) {
    const b = P[g.qua][k], [x, y] = g.qua_t;
    if (t < x) return a.clone().lerp(b, sm(t / x));
    if (t < y) return b.clone();
    return b.clone().lerp(c, sm((t - y) / (1 - y)));
  }
  return a.clone().lerp(c, sm(t));
}

// ================================================================ cảnh 3D
const khung = document.getElementById("canvas"), lopNhan = document.getElementById("nhan-lop");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
khung.appendChild(renderer.domElement);
const nhanR = new CSS2DRenderer({ element: lopNhan });
const scene = new THREE.Scene();
scene.background = MAU_NEN.clone();
const camera = new THREE.PerspectiveCamera(40, 1, .1, 200);
const TAM3 = V(-.6, 0, 0), TAM2 = V(-.5, 0, 0);
camera.position.copy(TAM3).add(V(.45, .38, 1).normalize().multiplyScalar(15));
const dk = new OrbitControls(camera, renderer.domElement);
dk.target.copy(TAM3); dk.enableDamping = true; dk.enablePan = false; dk.minDistance = 5; dk.maxDistance = 32;
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x1a1f33, 1.05));
const den1 = new THREE.DirectionalLight(0xffffff, 1.7); den1.position.set(5, 8, 7); scene.add(den1);
const den2 = new THREE.DirectionalLight(0x88aaff, .55); den2.position.set(-6, -3, -5); scene.add(den2);
// lưới tròn dưới chân: mốc không gian khi xoay 360°
const san = new THREE.PolarGridHelper(7, 16, 6, 64, 0x3a4a7a, 0x26304f);
san.position.set(-.6, -3.4, 0); san.material.transparent = true; scene.add(san);

const texSang = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d"), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.35, "rgba(255,255,255,.45)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
})();

// ---- nguyên tử: đủ C, H thật (r = bán kính quả cầu 3D, rg = khi trải phẳng)
const geoCau = new THREE.SphereGeometry(1, 40, 28);
const NT = {
  C:  { mau: "#33383f", r: .40, rg: .34, n3: "C",  ng: "C" },
  M1: { mau: "#33383f", r: .36, rg: .42, n3: "",   ng: "CH₃" },
  M2: { mau: "#33383f", r: .36, rg: .42, n3: "",   ng: "CH₃" },
  M3: { mau: "#33383f", r: .36, rg: .42, n3: "",   ng: "CH₃" },
  Br: { mau: "#a33a26", r: .60, rg: .38, n3: "Br", ng: "Br" },
  O:  { mau: "#e0453a", r: .44, rg: .42, n3: "O",  ng: "HO" },
  H:  { mau: "#f1f3f6", r: .25, rg: 0,   n3: "",   ng: "" },
};
const H_METYL = [];
for (const mk of ["M1", "M2", "M3"]) for (let j = 0; j < 3; j++) {
  const k = `${mk}h${j}`; H_METYL.push([k, mk, j]);
  NT[k] = { mau: "#eef0f4", r: .24, rg: 0, n3: "", ng: "" };
}
for (const d of Object.values(NT)) {
  d.goc = new THREE.Color(d.mau);
  d.mesh = new THREE.Mesh(geoCau, new THREE.MeshStandardMaterial({ color: d.goc.clone(), roughness: .38, metalness: .06 }));
  scene.add(d.mesh);
  const el = document.createElement("div"); el.className = "nhan"; el.textContent = d.n3;
  d.nhan = new CSS2DObject(el); scene.add(d.nhan);
}

// ---- liên kết
const geoTru = new THREE.CylinderGeometry(1, 1, 1, 18, 1, true);
const MAU_LK = new THREE.Color("#a7afbd");
const taoLK = (a, b, mo) => {
  const mesh = new THREE.Mesh(geoTru, new THREE.MeshStandardMaterial({ color: MAU_LK.clone(), roughness: .5, transparent: true }));
  scene.add(mesh); return { a, b, mo, mesh };
};
const LK = [
  taoLK("C", "M1", () => 1), taoLK("C", "M2", () => 1), taoLK("C", "M3", () => 1),
  taoLK("C", "Br", (i, t) => i < 2 ? 1 : i === 2 ? 1 - seg(t, .05, .5) : 0),
  taoLK("C", "O", (i, t) => i < 4 ? 0 : i === 4 ? seg(t, .45, .85) : 1),
  taoLK("O", "H", (i, t, m) => 1 - m),
  ...H_METYL.map(([k, mk]) => taoLK(mk, k, (i, t, m) => 1 - m)),
];
const Y = V(0, 1, 0);
const laH = k => k === "H" || /h\d$/.test(k);
let anH = false, heSoH = 1, hH = 1;    // hH: 1 = hiện H, 0 = ẩn (đổi mượt ~0,35 s)
function datLK(l, A, i, t, m) {
  const op = l.mo(i, t, m) * (laH(l.b) ? hH : 1), mesh = l.mesh;
  mesh.visible = op > .01; if (!mesh.visible) return;
  const a = A[l.a], b = A[l.b], d = b.clone().sub(a), len = d.length();

// ================================================================ điều khiển
