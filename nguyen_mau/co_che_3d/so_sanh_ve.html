<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>So sánh cách vẽ</title>
<style>
:root{--muc:#1b2621}
body{margin:0;background:#f6f1e6;font-family:system-ui,sans-serif;color:var(--muc);padding:20px 16px}
.to{max-width:1100px;margin:0 auto 18px;background:#fffdf7;border:1px solid #e3dccb;border-radius:6px;padding:16px 20px}
h2{font-size:16px;margin:0 0 8px}
.so-do{display:block;width:100%;height:auto}
.so-do .lk{stroke:var(--muc);stroke-width:1.6;stroke-linecap:round}
.so-do .lk.sau{stroke:var(--muc);stroke-width:1.4}
.so-do .nt{font:15.5px "Times New Roman",serif;text-anchor:middle;dominant-baseline:central;fill:var(--muc)}
.so-do .ten{font:700 16px "Times New Roman",serif;text-anchor:middle;dominant-baseline:central;fill:var(--muc)}
.so-do .mt{fill:none;stroke:var(--muc);stroke-width:1.3}
.so-do .pu{stroke:var(--muc);stroke-width:1.4}
.so-do .dk{font:italic 14px "Times New Roman",serif;text-anchor:middle;fill:var(--muc)}
.so-do .goc{fill:var(--muc)}
.cham{font-size:12.5px;color:#5d6862;margin:6px 0 0}
</style>
</head>
<body>
<div class="to"><h2>Tự động: vẽ từ SMILES theo kho mẫu học từ 1.384 hình ChemDraw trong đáp án</h2><div id="tu-dong"></div><p class="cham" id="c1"></p></div>
<script src="../../build/co_che/hsg_propellane_a4/hsg_propellane_a4.giay.js"></script><!-- dựng bằng: python -m server.ai.co_che.dung_bai_demo -->
<script type="module">
import { veSoDo, kiemTraDeNhin } from "./ve_giay.js";
const sd = window.SO_DO_TU_DONG;
document.getElementById("tu-dong").innerHTML = veSoDo(sd);
const loi = kiemTraDeNhin(sd);
document.getElementById("c1").textContent = "Bộ chấm: " + Object.entries(loi).map(([k, v]) => `${k} ${v.length}`).join(" · ") + (Object.values(loi).flat().length ? " — " + Object.values(loi).flat().join("; ") : " — đạt");
</script>
</body>
</html>
