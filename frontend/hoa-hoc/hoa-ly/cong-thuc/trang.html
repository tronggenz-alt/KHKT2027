<!DOCTYPE html>
<html lang="vi" data-theme="toi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện Công thức Hoá lý & Chứng minh từng bước | CHEMISTRY</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    // Khởi tạo theme
    try {
      var t = localStorage.getItem('giai-chuoi-giao-dien') || 'toi';
      document.documentElement.dataset.theme = t;
      if (t === 'toi') document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    } catch(e) {}

    // Cấu hình MathJax offline 100%
    window.MathJax = {
      startup: { typeset: false },
      chtml: {
        fontURL: "/static/vendor/mathjax-fonts/woff-v2",
        mtextInheritFont: true,
        merrorInheritFont: true,
        scale: 1.02
      },
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      }
    };
  </script>
  <script src="/static/vendor/tailwind.3.4.16.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', '-apple-system', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"SFMono-Regular"', 'Consolas', 'monospace']
          }
        }
      }
    };
  </script>
  <script src="/static/vendor/mathjax.3.2.2.js" defer></script>
</head>
<body class="text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-sky-500/20 selection:text-sky-400">

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-zinc-200 dark:border-zinc-800 bg-white/80 dark:bg-zinc-950/80 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <a href="/hoa-hoc/hoa-ly" class="p-2 rounded-xl text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" title="Trở về trung tâm Hoá lý">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <div class="flex items-center gap-2">
          <span class="text-xl font-bold font-serif text-sky-500">∑</span>
          <h1 class="text-base sm:text-lg font-bold tracking-tight">Thư viện Công thức Hoá lý</h1>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" id="hl-nut-che-do" class="p-2 rounded-xl text-zinc-500 hover:text-zinc-900 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition-colors" aria-label="Đổi giao diện sáng/tối">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5 block dark:hidden"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5 hidden dark:block"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 flex flex-col md:flex-row gap-6">

    <!-- Mục lục bên trái (Sidebar) -->
    <aside class="w-full md:w-64 shrink-0 space-y-5">
      <!-- Tìm kiếm -->
      <div class="relative">
        <input type="text" id="hl-tim-kiem" placeholder="Tìm công thức, ký hiệu..." class="w-full pl-9 pr-4 py-2 rounded-xl text-sm bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:ring-2 focus:ring-sky-500/50 dark:focus:ring-sky-400/50">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-4 h-4 text-zinc-400 absolute left-3 top-3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </div>

      <!-- Lọc theo Chủ đề -->
      <div class="space-y-1.5">
        <p class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500 px-2">Chủ đề</p>
        <div id="hl-danh-sach-chu-de" class="space-y-1">
          <button type="button" data-chu-de="tat-ca" class="hl-tab-cd w-full text-left px-3 py-2 rounded-xl text-xs font-semibold bg-sky-500/10 text-sky-600 dark:text-sky-400 flex items-center justify-between">
            <span>Tất cả</span>
            <span id="hl-so-luong-tat-ca" class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-sky-500/20">34</span>
          </button>
        </div>
      </div>

      <!-- Lọc theo Mức độ -->
      <div class="space-y-1.5 pt-2 border-t border-zinc-200 dark:border-zinc-800">
        <p class="text-xs font-bold uppercase tracking-wider text-zinc-400 dark:text-zinc-500 px-2">Mức độ</p>
        <div class="space-y-1 text-xs">
          <label class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800/60 cursor-pointer">
            <input type="checkbox" id="hl-loc-sgk" checked class="rounded border-zinc-300 dark:border-zinc-700 text-sky-500 focus:ring-sky-500">
            <span>SGK GDPT 2018</span>
          </label>
          <label class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800/60 cursor-pointer">
            <input type="checkbox" id="hl-loc-mo-rong" checked class="rounded border-zinc-300 dark:border-zinc-700 text-sky-500 focus:ring-sky-500">
            <span>Mở rộng · HSG</span>
          </label>
          <label class="flex items-center gap-2 px-3 py-1.5 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800/60 cursor-pointer">
            <input type="checkbox" id="hl-loc-dai-hoc" checked class="rounded border-zinc-300 dark:border-zinc-700 text-sky-500 focus:ring-sky-500">
            <span>Đại học · Chuyên ban</span>
          </label>
        </div>
      </div>
    </aside>

    <!-- Lưới thẻ công thức -->
    <section class="flex-1 min-w-0">
      <div class="flex items-center justify-between mb-4 pb-2 border-b border-zinc-200 dark:border-zinc-800">
        <h2 id="hl-tieu-de-nhom" class="text-sm font-bold text-zinc-800 dark:text-zinc-200">Tất cả công thức</h2>
        <span id="hl-so-luong-hien-thi" class="text-xs font-mono text-zinc-500">34 công thức</span>
      </div>

      <div id="hl-luoi-cong-thuc" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <!-- Render các thẻ công thức động bằng JS -->
      </div>
    </section>

  </main>

  <!-- Nạp các mô hình toán để tính ví dụ số -->
  <script src="/static/hoa-hoc/hoa-ly/khi-ly-tuong/mo-hinh.js"></script>
  <script src="/static/hoa-hoc/hoa-ly/toc-do-phan-ung/mo-hinh.js"></script>
  <script src="/static/hoa-hoc/hoa-ly/can-bang-le-chatelier/mo-hinh.js"></script>
  <script src="/static/hoa-hoc/hoa-ly/dong-co-nhiet/nhiet-dong.js"></script>
  <!-- Nạp mô-đun hình minh họa SVG và thành phần công thức -->
  <script src="/static/hoa-hoc/hoa-ly/chung/hinh-chung-minh.js"></script>
  <script src="/static/hoa-hoc/hoa-ly/chung/cong-thuc.js"></script>

  <script>
    (function () {
      'use strict';

      var DU_LIEU = null;
      var CHU_DE_DANG_CHON = 'tat-ca';

      function xoaDauTiengViet(str) {
        if (!str) return '';
        return str
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/đ/g, 'd').replace(/Đ/g, 'D')
          .toLowerCase();
      }

      async function khoiTao() {
        DU_LIEU = await HLCongThuc.taiDuLieu();
        dungSidebarChuDe();
        apDungBoLoc();
        kiemTraUrlQuery();
      }

      function dungSidebarChuDe() {
        var danhSachEl = document.getElementById('hl-danh-sach-chu-de');
        if (!danhSachEl || !DU_LIEU) return;

        var soTatCaEl = document.getElementById('hl-so-luong-tat-ca');
        if (soTatCaEl) {
          soTatCaEl.textContent = (DU_LIEU.cong_thuc || []).length;
        }

        (DU_LIEU.chu_de || []).forEach(function (cd) {
          var count = DU_LIEU.cong_thuc.filter(function (ct) { return ct.chu_de === cd.id; }).length;
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.setAttribute('data-chu-de', cd.id);
          btn.className = 'hl-tab-cd w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 transition-colors flex items-center justify-between';
          btn.innerHTML = '<span>' + cd.ten + '</span><span class="text-[11px] font-mono px-1.5 py-0.5 rounded bg-zinc-100 dark:bg-zinc-800 text-zinc-500">' + count + '</span>';
          btn.addEventListener('click', function () {
            chonChuDe(cd.id);
          });
          danhSachEl.appendChild(btn);
        });

        document.querySelector('[data-chu-de="tat-ca"]').addEventListener('click', function () {
          chonChuDe('tat-ca');
        });
      }

      function chonChuDe(cdId) {
        CHU_DE_DANG_CHON = cdId;
        document.querySelectorAll('.hl-tab-cd').forEach(function (btn) {
          var laChon = btn.getAttribute('data-chu-de') === cdId;
          if (laChon) {
            btn.className = 'hl-tab-cd w-full text-left px-3 py-2 rounded-xl text-xs font-semibold bg-sky-500/10 text-sky-600 dark:text-sky-400 flex items-center justify-between';
          } else {
            btn.className = 'hl-tab-cd w-full text-left px-3 py-2 rounded-xl text-xs font-semibold text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/60 transition-colors flex items-center justify-between';
          }
        });
        apDungBoLoc();
      }

      function apDungBoLoc() {
        if (!DU_LIEU) return;
        var tuKhoa = xoaDauTiengViet(document.getElementById('hl-tim-kiem').value.trim());
        var choPhepSgk = document.getElementById('hl-loc-sgk').checked;
        var choPhepMoRong = document.getElementById('hl-loc-mo-rong').checked;
        var choPhepDaiHoc = document.getElementById('hl-loc-dai-hoc').checked;

        var luoi = document.getElementById('hl-luoi-cong-thuc');
        luoi.innerHTML = '';

        var ketQua = DU_LIEU.cong_thuc.filter(function (ct) {
          // Lọc chủ đề
          if (CHU_DE_DANG_CHON !== 'tat-ca' && ct.chu_de !== CHU_DE_DANG_CHON) return false;

          // Lọc mức độ
          if (ct.muc_do === 'sgk' && !choPhepSgk) return false;
          if (ct.muc_do === 'mo-rong' && !choPhepMoRong) return false;
          if (ct.muc_do === 'dai-hoc' && !choPhepDaiHoc) return false;

          // Lọc từ khoá không dấu
          if (tuKhoa) {
            var text = xoaDauTiengViet(ct.ten + ' ' + ct.ma + ' ' + (ct.latex_text || '') + ' ' + (ct.dieu_kien || ''));
            if (!text.includes(tuKhoa)) return false;
          }

          return true;
        });

        document.getElementById('hl-so-luong-hien-thi').textContent = ketQua.length + ' công thức';

        ketQua.forEach(function (ct) {
          var card = HLCongThuc.taoTheCongThuc(ct);
          luoi.appendChild(card);
        });

        if (ketQua.length === 0) {
          luoi.innerHTML = '<div class="col-span-full p-8 text-center text-zinc-500 dark:text-zinc-400 border border-dashed border-zinc-200 dark:border-zinc-800 rounded-2xl">Không tìm thấy công thức nào phù hợp với bộ lọc.</div>';
        }
      }

      function kiemTraUrlQuery() {
        if (!DU_LIEU) return;
        var params = new URLSearchParams(window.location.search);
        var maCM = params.get('chung-minh');
        var hash = window.location.hash ? window.location.hash.replace('#', '') : null;
        var mucTieu = maCM || hash;

        if (mucTieu) {
          var ct = DU_LIEU.cong_thuc.find(function (c) {
            return c.ma.toLowerCase() === mucTieu.toLowerCase() || c.id.toLowerCase() === mucTieu.toLowerCase();
          });
          if (ct) {
            if (maCM) {
              HLCongThuc.moHopChungMinh(ct);
            } else {
              setTimeout(function () {
                var el = document.getElementById('ct-' + ct.id) || document.getElementById('ct-' + ct.ma);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
              }, 100);
            }
          }
        }
      }

      // Gắn sự kiện giao diện
      document.getElementById('hl-tim-kiem').addEventListener('input', apDungBoLoc);
      document.getElementById('hl-loc-sgk').addEventListener('change', apDungBoLoc);
      document.getElementById('hl-loc-mo-rong').addEventListener('change', apDungBoLoc);
      document.getElementById('hl-loc-dai-hoc').addEventListener('change', apDungBoLoc);

      // Nút sáng tối
      document.getElementById('hl-nut-che-do').addEventListener('click', function () {
        var hienTai = document.documentElement.dataset.theme;
        var moi = hienTai === 'toi' ? 'sang' : 'toi';
        document.documentElement.dataset.theme = moi;
        if (moi === 'toi') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        try { localStorage.setItem('giai-chuoi-giao-dien', moi); } catch (e) {}
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', khoiTao);
      } else {
        khoiTao();
      }
    })();
  </script>
</body>
</html>
