<!doctype html>
<html lang="vi" data-theme="sang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hoá lý · CHEMISTRY</title>
  <meta name="description" content="Mục Hoá lý tương tác: mô phỏng nhiệt động học, chu trình nhiệt, đồ thị p–V, T–s, định luật I, động học và cân bằng hoá học.">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f2b48' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 3h6M10 3v6L4.5 18.5A2 2 0 0 0 6.2 21.5h11.6a2 2 0 0 0 1.7-3L14 9V3'/%3E%3Cpath d='M7 15h10'/%3E%3C/svg%3E">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("giai-chuoi-giao-dien"); } catch (e) {}
      if (t !== "sang" && t !== "toi") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "toi" : "sang";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Be Vietnam Pro"', '-apple-system', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['"JetBrains Mono"', '"SFMono-Regular"', 'Consolas', 'monospace'],
          },
          colors: {
            giay: 'var(--giay)', 'giay-lom': 'var(--giay-lom)', muc: 'var(--muc)', 'muc-2': 'var(--muc-2)', lang: 'var(--lang)',
            chi: 'var(--chi)', 'chi-dam': 'var(--chi-dam)', nhan: 'var(--nhan)', 'nhan-lom': 'var(--nhan-lom)',
            'ho-phach': 'var(--ho-phach)', gach: 'var(--gach)', lam: 'var(--lam)',
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/hoa-hoc/hoa-ly/trung-tam.js"></script>
</head>
<body class="bg-giay text-muc min-h-screen flex flex-col font-sans transition-colors duration-200">
  <!-- Thanh điều hướng trên -->
  <header class="border-b border-chi bg-giay/95 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-3 sm:gap-4">
        <a href="/" class="font-mono text-base sm:text-lg font-bold tracking-tight text-nhan hover:opacity-85 transition-opacity flex items-center gap-1.5" title="Về trang chủ">
          <span>chemistry:</span>
        </a>
        <span class="text-lang">/</span>
        <nav class="flex items-center gap-1.5 text-xs sm:text-sm" aria-label="Breadcrumb">
          <a href="/" class="text-lang hover:text-muc transition-colors">Hoá học</a>
          <span class="text-lang">›</span>
          <span class="font-medium text-muc">Hoá lý</span>
        </nav>
      </div>

      <div class="flex items-center gap-2">
        <a href="/" class="text-xs sm:text-sm text-lang hover:text-muc px-2.5 py-1 rounded transition-colors hidden sm:inline-block">Về trang giải</a>
        <button type="button" id="nut-che-do" class="nut-che-do p-2 rounded-lg border border-chi hover:bg-giay-lom transition-colors text-muc" aria-label="Chuyển chế độ sáng/tối" title="Chuyển chế độ sáng/tối">
          <svg class="bieu-tuong-trang w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
          <svg class="bieu-tuong-mat-troi w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Nội dung trung tâm -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <!-- Tiêu đề mục -->
    <div class="mb-8 sm:mb-10">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-nhan/10 text-nhan mb-3">
        <span>MÔ PHỎNG TƯƠNG TÁC 2D</span>
        <span>·</span>
        <span>CHUYÊN ĐỀ HOÁ LÝ</span>
      </div>
      <h1 id="hl-muc-tieu-de" class="text-2xl sm:text-4xl font-bold tracking-tight text-muc">Hoá lý</h1>
      <p id="hl-muc-mo-ta" class="mt-2 text-sm sm:text-base text-lang max-w-2xl">
        Mô phỏng tương tác các quy luật nhiệt động học, khí, cân bằng và tốc độ phản ứng.
      </p>
    </div>

    <!-- Lưới thẻ mô phỏng -->
    <div id="luoi-mo-phong" class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6">
      <div class="p-6 rounded-xl border border-chi bg-the-lon-nen animate-pulse">
        <div class="h-6 w-1/3 bg-chi rounded mb-4"></div>
        <div class="h-4 w-2/3 bg-chi rounded mb-2"></div>
        <div class="h-4 w-1/2 bg-chi rounded"></div>
      </div>
    </div>
  </main>

  <!-- Chân trang -->
  <footer class="border-t border-chi py-6 text-center text-xs text-lang">
    <p>CHEMISTRY · Phân hệ Mô phỏng Hoá lý 2D</p>
  </footer>
</body>
</html>
