<text x="820" y="330" class="tw" text-anchor="start" >Không cắm pin vào chân 5V: mạch hạ áp trên DevKit</text>
<text x="820" y="346" class="tw" text-anchor="start" >cần điện áp cao hơn pin.</text>
<text x="820" y="362" class="tw" text-anchor="start" >HT7333 chỉ cho 250 mA, không đủ khi bật Wi-Fi.</text>
<text x="820" y="380" class="ts" text-anchor="start" >Mạch hạ áp chưa có hốc riêng trong mô hình,</text>
<text x="820" y="396" class="ts" text-anchor="start" >gói co nhiệt đi cùng dây.</text>
