<text x="580" y="552" class="t" text-anchor="start" >ESP32 (ADC 12 bit, 11 dB) đọc ≈ 2462 → 2817, tức khoảng 356 mức.</text>
<text x="580" y="570" class="ts" text-anchor="start" >Lấy trung bình 8 mẫu để giảm nhiễu ADC, rồi đổi ra 0–100%.</text>
<text x="580" y="588" class="ts" text-anchor="start" >Mô hình: nam châm trụ N35 (Br ≈ 1,2 T); SS49E ≈ 0,92 mV/G ở 3,3 V. Đây là ước tính, chưa đo.</text>
<text x="40" y="640" class="hs" text-anchor="start" >KHI LẮP VÀ LẬP TRÌNH</text>
<text x="40" y="662" class="ts" text-anchor="start" >Lúc khởi động đọc mức nhả làm min, bóp hết một lần lấy max: % = (đọc − min) / (max − min). Lật nam châm thì điện áp giảm.</text>
<text x="40" y="680" class="ts" text-anchor="start" >Khe hẹp nhất còn 3,58 mm nên SS49E chưa bão hòa. Nếu tầm đọc quá hẹp khi đo thật, có thể dùng nam châm dày hơn.</text>
