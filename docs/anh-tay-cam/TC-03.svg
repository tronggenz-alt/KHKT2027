<text x="640" y="384" class="hs" text-anchor="start" >GHI CHÚ</text>
<text x="640" y="404" class="ts" text-anchor="start" >1. Khối lượng hộp ước tính ≈ 420 g (hộp 110, sạc 210, mạch 77, dây 20).</text>
<text x="640" y="422" class="ts" text-anchor="start" >2. Một cáp USB: sạc → cổng USB-B của Mega. Cáp thứ hai cắt đầu: đường 5V riêng</text>
<text x="640" y="440" class="ts" text-anchor="start" >    cho L298N và ESP32-CAM, để mô-tơ và Wi-Fi không đi qua cầu chì 500 mA của Mega.</text>
<text x="640" y="458" class="ts" text-anchor="start" >3. Sạc dự phòng tự tắt khi dòng tải dưới khoảng 50–100 mA: tải ở đây ≈ 250 mA, không bị.</text>
